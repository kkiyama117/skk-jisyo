name: Jisyo check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: make check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: '1.94.0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
          architecture: 'x64'
          allow-prereleases: false
      - name: Set up Rust
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Tool versions
        run: python3 --version && rustc --version && cargo --version
      - name: Check iconv
        run: command -v iconv && iconv --version
      - name: Fetch locked dependencies
        run: CARGO_NET_OFFLINE=false cargo fetch --locked
      - name: Run gate
        run: make check
